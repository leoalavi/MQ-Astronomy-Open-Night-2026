# Map · walking directions — the DECLINE / sharing-off boundary (B2, §2b)
#
# The first-use disclosure modal was retired (opening Directions is implicit
# consent — see privacy-consent.yaml). The standing opt-out lives in Settings:
# "Revoke Google Maps access" sets consent to declined, and a subsequent
# Directions tap lands on the in-app sharing-off panel — a re-disclosure body +
# a one-tap re-enable — with NO Google map drawn and NO bounce out to the
# external Google Maps app. This flow proves that declined boundary and that the
# way back to the campus map works.
appId: au.edu.mq.astronomy.aon2026
tags: [map]
---
- launchApp:
    clearState: true
# Accept implicitly once (the Settings revoke control only appears once consent
# has been given), then return to the map.
- runFlow: flows/open-map.yaml
- tapOn: "Directions"
- assertNotVisible: "Use Google Maps for directions?"
- assertVisible: "Central Courtyard"
- tapOn: "Back"
- assertVisible: "Zoom in"

# ── Revoke in Settings (rightmost tab, EN 6-tab layout) ──
- tapOn:
    point: "88%,91%"
- scrollUntilVisible:
    element:
      text: "Revoke Google Maps access"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 20
- tapOn: "Revoke Google Maps access"
- assertVisible: "Turn Google Maps directions back on"

# ── Retry Directions → declined path → sharing-off panel, NOT a Google map ──
- tapOn:
    point: "58%,91%"
- assertVisible: "Zoom in"
- tapOn: "Directions"
- assertNotVisible: "Use Google Maps for directions?"
- assertVisible: "Central Courtyard"
- assertVisible: "Use Google Maps"
- assertVisible: "(?s).*sent to Google Maps.*"
- assertNotVisible: "Zoom in"
- takeScreenshot: .maestro/screenshots/wayfinding-01-sharing-off

# The way back works — Back returns to the campus map.
- tapOn: "Back"
- assertVisible: "Zoom in"
