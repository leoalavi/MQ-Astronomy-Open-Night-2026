<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Event discovery and night-time campus wayfinding for Macquarie University Astronomy Open Night 2026.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Astronomy Open Night">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Astronomy Open Night 2026</title>
  <link rel="manifest" href="manifest.json">

  <!--
    GOOGLE MAPS (WEB) — API KEY PLACEHOLDER.

    Turn-by-turn walking navigation uses google_maps_flutter. On Android and iOS
    the key is injected from the MAPS_API_KEY build secret (see
    docs/google-maps-setup.md); the app degrades gracefully to "map unavailable"
    when the key is absent, so it is safe to ship without one.

    To enable the Google map on the WEB build, uncomment the line below and
    replace YOUR_WEB_MAPS_API_KEY with a browser-restricted Maps JavaScript API
    key. Leave it commented (the default) to ship web without Google Maps — the
    illustrated campus basemap works regardless. Do NOT commit a real key here.
  -->
  <!-- <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_WEB_MAPS_API_KEY"></script> -->
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
