# Map · walking directions (Google nav entry)
#
# The map's "Directions" FAB pushes the in-app Google nav screen
# (`Routes.googleNavTo(...)`) — the app consolidated on one directions surface,
# "always Google Maps", and the old offline origin/destination picker
# (`wayfinding_screen.dart`) is no longer reachable (audit 2026-08-30, MAP-007).
#
# Consent model (verified 2026-09-01): opening the Google nav screen IS the
# choice to use Google directions — a first-run `unknown` consent is
# auto-accepted and the passive privacy notice + opt-out live in Settings
# (unit: google_nav_screen_test 'first-run auto-proceeds no modal';
#  settings_google_consent_test turning sharing OFF). So there is NO pre-draw
# disclosure modal. The §2b boundary (no Google surface initialises before
# consent resolves positively) is enforced by `mapsSdkReadyProvider` and proven
# in unit tests (maps_sdk_ready_provider_test, routes_consent_guard_test); on
# device we assert the live UI: no modal, an in-app nav screen (never a bounce
# out to the Google Maps app, never a blank Google-tiles view), and a clean
# return to the campus map.
appId: au.edu.mq.astronomy.aon2026
tags: [map]
---
- runFlow: flows/open-map.yaml

- tapOn: "Directions"

# No disclosure modal — the flow auto-proceeds into the in-app nav screen.
- assertNotVisible: "Use Google Maps for directions?"
# The nav screen for the FAB's default destination (Central Courtyard).
- assertVisible: "Central Courtyard"
- takeScreenshot: .maestro/screenshots/wayfinding-01-nav-screen

# Back returns to the campus map — the visitor never leaves AON.
- tapOn: "Back"
- assertVisible: "Directions"
- assertVisible: "Zoom in"
- takeScreenshot: .maestro/screenshots/wayfinding-02-back-on-map
