appId: au.edu.mq.astronomy.aon2026
---
# Cold-launch and land on the campus map, fitted.
#
# The bottom-nav "Map" tab is tapped BY POINT deliberately. Text matching is
# unusable here: the tab's Flutter semantics become "Map\nMap" (label + tooltip)
# once selected, which no `text:` regex Maestro accepts will match, while the
# AppBar title and the mode-toggle segment are BOTH exactly "Map" — so
# `tapOn: "Map"` silently hits the wrong one. The tab bar is also an animated
# LiquidTabBar whose pill expands on selection, shifting its neighbours, so
# bounds read from the hierarchy go stale mid-tap.
#
# The percentage is TAB-COUNT DEPENDENT and was 68% while there were five tabs.
# Settings became a sixth, first-class tab, which moved Map from slot 4-of-5 to
# slot 4-of-6 and silently pointed 68% at Info instead — every map flow then ran
# against the wrong screen. Verified from the hierarchy: Map occupies [220,288]
# of a 440pt-wide bar, so its centre is 254/440 = 57.7%.
# If a tab is ever added or removed again, recompute this.
- stopApp
- launchApp
# Let Home render before touching the tree (XCTest can crash on a cold-boot
# touch; on Android 16 the restart is slow enough that an immediate by-point
# tap lands on nothing — 2026-09-05).
- extendedWaitUntil:
    visible: "Astronomy Open Night"
    timeout: 20000
- swipe:
    direction: DOWN
    duration: 100
# From HOME the unselected Map tab's semantics label "Map" is unique (the
# AppBar title / mode-toggle "Map" ambiguity only exists once the Map screen is
# open), and a label tap re-queries the tree — which is what makes it survive
# Android 16's slower restart where the by-point tap missed (2026-09-05).
- tapOn: "Map"
- assertVisible: "Zoom in"
