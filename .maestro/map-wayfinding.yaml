# Map · walking directions (consent gate)
#
# The map's "Directions" FAB now pushes the CONSENT-GATED Google nav screen
# (`Routes.googleNavTo(...)`) — the app consolidated on one directions surface,
# "always Google Maps", and the old offline origin/destination picker
# (`wayfinding_screen.dart`) is no longer reachable (audit 2026-08-30, MAP-007).
#
# So this flow now exercises the CONSENT INVARIANT (spec §2b): no Google surface
# initialises until consent resolves positively. Tapping Directions must raise the
# disclosure BEFORE any Google map is drawn, and declining must return to the
# campus map without ever touching the network.
appId: au.edu.mq.astronomy.aon2026
tags: [map]
---
- runFlow: flows/open-map.yaml

- tapOn: "Directions"

# The disclosure appears BEFORE any Google surface is built — the invariant.
- assertVisible: "Use Google Maps for directions?"
- assertVisible: "(?s).*your current location is sent to Google Maps.*"
- takeScreenshot: .maestro/screenshots/wayfinding-01-consent

# Decline. Tapped by POINT: a dialog button's label is not its hit target
# (.maestro/README.md trap 6) — `tapOn: "Not now"` reports success and does
# nothing. "Not now" sits at [105,551]-[197,607] of a 440x956 frame → ~34%,61%.
- tapOn:
    point: "34%,61%"
- waitForAnimationToEnd:
    timeout: 5000

# Declined → back on the campus map, no Google map ever drawn.
- assertVisible: "Directions"
- assertVisible: "Zoom in"
- takeScreenshot: .maestro/screenshots/wayfinding-02-declined-back-on-map
