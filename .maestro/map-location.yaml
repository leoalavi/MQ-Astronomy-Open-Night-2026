# Map · location, permission and the honest off-campus / off-footprint notes
#
# Tests: entering the Map does NOT prompt for location (contextual permission —
# changed 2026-09-05 for the Play/App Store audits: the OS dialog appears only
# on the first "Show my location" tap), an on-campus fix then draws the dot and
# the control follows, and a far-away fix produces the off-campus banner rather
# than a clamped dot at the map edge (spec §5.4/§5.5 — the projector NEVER
# clamps).
appId: au.edu.mq.astronomy.aon2026
tags: [map, location]
---
# Central Courtyard — squarely inside the frozen calibration domain.
- setLocation:
    latitude: -33.7737
    longitude: 151.1134
- launchApp:
    clearState: true
    permissions:
      location: unset   # Maestro grants everything by default; the flow needs the PRE-grant state
- extendedWaitUntil:
    visible: "Astronomy Open Night"
    timeout: 20000
- swipe:
    direction: DOWN
    duration: 100
- tapOn: "Map"
- assertVisible: "Zoom in"

# No permission sheet on entry: the control reads "Show my location" (inactive)
# until the visitor asks. The first tap is what raises the OS dialog (iOS:
# "Allow While Using App"; the grant persists across relaunches, so the
# dialog taps are optional). A granted Locate tap goes straight to FOLLOW.
- assertNotVisible: "Allow While Using App"
- assertNotVisible: "While using the app"
- assertVisible: "Show my location"
- tapOn: "Show my location"
- tapOn:
    text: "Allow While Using App"
    optional: true
- tapOn:
    text: "While using the app"
    optional: true
- assertVisible: "Stop following my location"
- takeScreenshot: .maestro/screenshots/location-01-on-campus
- tapOn: "Stop following my location"
- assertVisible: "Follow my location"

# ── a FIRST fix far from campus must produce the honest banner, not a fake dot ──
# A relaunch (fresh LocationController) is deliberate: the fix-settling policy
# (shouldAdoptFix) CORRECTLY rejects an instant on-campus→CBD teleport as a
# physically-impossible ~10 km jump (location_fix_settling_test), so the
# off-campus fix must arrive as the first fix of a session — exactly as it would
# for a visitor opening the app from home. Sydney CBD, ~10 km south-east.
- setLocation:
    latitude: -33.8688
    longitude: 151.2093
- launchApp:
    clearState: true
    permissions:
      location: unset   # Maestro grants everything by default; the flow needs the PRE-grant state
- extendedWaitUntil:
    visible: "Astronomy Open Night"
    timeout: 20000
- swipe:
    direction: DOWN
    duration: 100
- tapOn: "Map"
- assertVisible: "Zoom in"
# Fresh state → nothing is asked on entry; ask for the position explicitly.
- assertVisible: "Show my location"
- tapOn: "Show my location"
- tapOn:
    text: "Allow While Using App"
    optional: true
- tapOn:
    text: "While using the app"
    optional: true
# With an off-campus fix, project() returns null off the illustrated footprint,
# so the app shows the honest distance banner — never a dot clamped to the edge
# of the artwork.
- assertVisible: ".*km from campus"
- takeScreenshot: .maestro/screenshots/location-02-off-campus
