# Privacy · Google directions render in real Persian, RTL (B2, §2b)
#
# The first-use disclosure modal was retired (opening Directions is implicit
# consent — see privacy-consent.yaml). This proves the resulting in-app Google
# nav screen renders in real Persian with a correct RTL layout: the campus-map
# chrome is left behind, NO retired first-use modal appears, and the live Google
# surface + the "Walking directions" route heading come up in Persian.
#
# RTL note: the bottom nav mirrors under Persian — Settings on the LEFT (~12%),
# Map at ~42% (it was ~58% in LTR). Directions FAB = "راهنمای مسیر".
appId: au.edu.mq.astronomy.aon2026
tags: [map, settings]
---
- setLocation:
    latitude: -33.7737
    longitude: 151.1134
- launchApp:
    clearState: true
- swipe:
    direction: DOWN
    duration: 100

# ── Switch to Persian in Settings (still LTR here → Settings on the right) ──
- tapOn:
    point: "88%,91%"
- tapOn: "Persian"
# UI is now Persian/RTL — assert the Persian Settings title.
- assertVisible: "تنظیمات"

# ── Map (RTL mirror → left of centre) → Directions ──
- tapOn:
    point: "42%,91%"
- assertVisible: "بزرگ‌نمایی"        # Zoom in (Persian) — on the campus map
- tapOn: "راهنمای مسیر"              # Directions (Persian FAB)

# ── The in-app Google nav screen, in Persian — implicit accept, NO modal ──
- assertNotVisible: "برای مسیریابی از نقشهٔ گوگل استفاده شود؟"  # the retired modal title
- assertNotVisible: "بزرگ‌نمایی"      # we left the campus map
# The nav screen rendered in Persian/RTL — its back control reads "برگشتن"
# (Back), on the right under RTL. (The live route itself needs a location fix,
# which a fresh install may not have granted, so it is not asserted here.)
- assertVisible: "برگشتن"
- takeScreenshot: .maestro/screenshots/fa-01-directions-rtl
