# Home page
#
# Home answers, in order: what is this event, what is on now/next, where do I go,
# what have I saved. This exercises the hero + date, the passport card, an
# "Up next" event card (favourite it), the "See the whole tonight" link, and the
# campus-map CTA. Merged multi-line a11y rows with bidi-isolated venue names, so
# match with `(?s).*…*` (DOTALL + isolate-absorbing).
appId: au.edu.mq.astronomy.aon2026
tags: [home]
---
# Clear stored state so the flow is order-independent — otherwise a favourite
# saved by a prior run leaves the card reading "Remove…" instead of "Save…".
- launchApp:
    clearState: true
- assertVisible: "Astronomy Open Night"
- assertVisible: "(?s).*Saturday 19 September 2026.*4pm – 10pm.*"
- assertVisible: "(?s).*Image credit.*Aleix Roig.*"
- assertVisible: "(?s).*Astronomy Passport.*of 9 stamps.*"
- assertVisible: "(?s).*Up next.*"

# Post-Liz (2026-08-31) the two "Open all night" activities lead the rail
# (they start at the 4pm event open, ahead of the 4.15pm crowd). Capture the
# cosmos is fullEventConfirmed — a published 4pm start — so it keeps its time.
# Solar system walk is openAllNight (Liz: "no set opening times") and must NOT
# show a fabricated start; that honesty guard runs on the Program screen where
# the card is fully visible (this rail only peeks two cards).
- assertVisible: "(?s).*On the night · 4pm.*Capture the cosmos.*Open all night.*"
# Favourite it from the card.
- tapOn: "(?s).*Save Capture the cosmos to My Night.*"
- takeScreenshot: .maestro/screenshots/home-01-saved

# The whole-programme link and the map CTA are reachable below the fold.
- scrollUntilVisible:
    element:
      text: "See the whole tonight"
    direction: DOWN
- assertVisible: "See the whole tonight"
- scrollUntilVisible:
    element:
      text: "(?s).*Open the campus map.*walking directions from the car parks.*"
    direction: DOWN
- assertVisible: "(?s).*Open the campus map.*walking directions from the car parks.*"
- takeScreenshot: .maestro/screenshots/home-02-map-cta
