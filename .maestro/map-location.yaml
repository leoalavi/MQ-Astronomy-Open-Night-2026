# Map · location, permission and the honest off-campus / off-footprint notes
#
# Tests: entering the Map requests location permission (it is a core feature of
# the screen — not deferred to a "Locate Me" tap), an on-campus fix draws the
# dot, the control then follows, and a far-away fix produces the off-campus
# banner rather than a clamped dot at the map edge (spec §5.4/§5.5 — the
# projector NEVER clamps).
appId: au.edu.mq.astronomy.aon2026
tags: [map, location]
---
# Central Courtyard — squarely inside the frozen calibration domain.
- setLocation:
    latitude: -33.7737
    longitude: 151.1134
- runFlow: flows/open-map.yaml

# Permission is requested on ENTERING the Map tab, before any tap. iOS shows the
# sheet here on the very first run after install (the grant persists across
# relaunches, so both taps are optional).
- tapOn:
    text: "Allow While Using App"
    optional: true
- tapOn:
    text: "Allow Once"
    optional: true
- takeScreenshot: .maestro/screenshots/location-01-on-campus

# Granted on entry → the dot is already live and the control now offers to
# FOLLOW (not the first-run "Show my location"). "Locate Me" simply recenters
# and starts follow when permission is already held.
- assertVisible: "Follow my location"
- tapOn: "Follow my location"
- assertVisible: "Stop following my location"

# ── a FIRST fix far from campus must produce the honest banner, not a fake dot ──
# A relaunch (fresh LocationController) is deliberate: the fix-settling policy
# (shouldAdoptFix) CORRECTLY rejects an instant on-campus→CBD teleport as a
# physically-impossible ~10 km jump (location_fix_settling_test), so the
# off-campus fix must arrive as the first fix of a session — exactly as it would
# for a visitor opening the app from home. Sydney CBD, ~10 km south-east.
- setLocation:
    latitude: -33.8688
    longitude: 151.2093
- launchApp:
    clearState: true
- runFlow: flows/open-map.yaml
# Fresh state → the entry-time permission sheet appears again; grant it.
- tapOn:
    text: "Allow While Using App"
    optional: true
# Granted on entry with an off-campus fix: project() returns null off the
# illustrated footprint, so the app shows the honest distance banner with no
# Locate tap needed — never a dot clamped to the edge of the artwork.
- assertVisible: ".*km from campus"
- takeScreenshot: .maestro/screenshots/location-02-off-campus
