# Map · 360° picker
#
# The picker lists the D–I legend venues, every one of which now has a 360° tour.
# Regression guard for the field fix that made its ListView reserve the floating
# tab-bar clearance: the LAST card ("I · 17 Wally's Walk") must be reachable AND
# tappable, not hidden behind the island (audit 2026-08-30).
#
# Rows are merged 3-line a11y strings with bidi isolates on the placeholder name,
# so match with `(?s).*…*` (DOTALL crosses the newlines; `.*` absorbs isolates).
appId: au.edu.mq.astronomy.aon2026
tags: [map]
---
- runFlow: flows/open-map.yaml

- tapOn:
    text: "360°"
# The Solar system walk is pinned at the TOP, above the D-I letters (2026-09-01).
# It is a route tour, so it reads with its own route subtitle, not "Tap to
# explore". Its own open+navigate proof is in map-solar-walk.yaml.
- assertVisible: "(?s).*Solar system walk.*Central Courtyard to Telescope Park.*"
# The picker rendered. G shipped 2026-08-31, so every D-I card is now tourable
# and none reads "Coming soon".
- assertVisible: "(?s).*E . 1 Central Courtyard.*Tap to explore.*"
- assertVisible: "(?s).*G . Macquarie University Astronomical Observatory.*Tap to explore.*"

# The last legend card must be reachable past the floating tab bar.
- scrollUntilVisible:
    element:
      text: "(?s).*I . 17 Wally.s Walk.*Tap to explore.*"
    direction: DOWN
- assertVisible: "(?s).*I . 17 Wally.s Walk.*Tap to explore.*"
- takeScreenshot: .maestro/screenshots/panorama-01-last-card-reachable

# ...and it is genuinely tappable — it opens the tour rather than being trapped
# under the bar.
- tapOn: "(?s).*I . 17 Wally.s Walk.*Tap to explore.*"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: .maestro/screenshots/panorama-02-tour-open
