# Privacy · revoke → retry → re-enable (B2 closure §9)
#
# Accept directions (implicit — the first-use modal was retired), then turn
# Google Maps sharing OFF in Settings ("Revoke Google Maps access"), then ask
# for Directions again. The visitor must NOT be silently re-accepted: the retry
# lands on the in-app sharing-off panel (a re-disclosure + an explicit one-tap
# re-enable), with NO Google map. Only an explicit tap on "Use Google Maps"
# restores it.
#
# Consent model (verified in source): Settings "Revoke" -> declined; the declined
# branch of google_nav_screen shows the sharing-off panel, whose re-enable button
# calls accept(). (erase-my-data instead resets to unknown -> implicit accept on
# the next Directions; that path is covered elsewhere.)
appId: au.edu.mq.astronomy.aon2026
tags: [map, settings]
---
- launchApp:
    clearState: true
- setLocation:
    latitude: -33.7737
    longitude: 151.1134
- runFlow: flows/open-map.yaml

# ── Accept (implicit — no modal), then back to the map ──
- tapOn: "Directions"
- assertNotVisible: "Use Google Maps for directions?"
- assertVisible: "Central Courtyard"
- tapOn: "Back"
- assertVisible: "Zoom in"

# ── Revoke in Settings (rightmost tab, EN 6-tab layout) ──
- tapOn:
    point: "88%,91%"
- scrollUntilVisible:
    element:
      text: "Revoke Google Maps access"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 20
- tapOn: "Revoke Google Maps access"
- assertVisible: "Turn Google Maps directions back on"

# ── Retry Directions: must NOT be silently re-accepted ──
- tapOn:
    point: "58%,91%"
- assertVisible: "Zoom in"
- tapOn: "Directions"
# Declined path → sharing-off panel, NOT a live Google map.
- assertNotVisible: "Use Google Maps for directions?"
- assertVisible: "Central Courtyard"
- assertVisible: "Use Google Maps"
- assertVisible: "(?s).*sent to Google Maps.*"
- assertNotVisible: "Zoom in"
- takeScreenshot: .maestro/screenshots/revoke-01-sharing-off

# ── Explicit re-enable dismisses the sharing-off panel (accept restored) ──
- tapOn: "Use Google Maps"
- assertNotVisible: "(?s).*sent to Google Maps.*"
- takeScreenshot: .maestro/screenshots/revoke-02-reenabled
