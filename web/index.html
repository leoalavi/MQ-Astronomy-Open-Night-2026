<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Event discovery and night-time campus wayfinding for Macquarie University Astronomy Open Night 2026.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Astronomy Open Night">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Astronomy Open Night 2026</title>
  <link rel="manifest" href="manifest.json">

  <!--
    GOOGLE MAPS (WEB).

    There is deliberately NO <script src="maps.googleapis.com/maps/api/js?key=...">
    tag here. google_maps_flutter_web's README tells you to paste one in, but this
    file is committed, so the key would become a tracked secret.

    Instead the app injects the Maps JavaScript API at runtime, with the key that
    every other platform already resolves (MAPS_API_KEY, supplied via
    --dart-define-from-file=.env). See lib/services/maps_js_loader_web.dart. It
    loads once and is reused, so returning to Directions does not re-add the tag.

    Run/build web with:
      flutter run -d chrome --dart-define-from-file=.env
    Without the key the app degrades to a truthful "map unavailable" state — the
    illustrated campus basemap keeps working regardless.

    NOTE: a web key is public by nature (it ships in the JS bundle), so a
    production web key MUST carry an HTTP-referrer restriction. See
    docs/google-maps-setup.md.
  -->
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
