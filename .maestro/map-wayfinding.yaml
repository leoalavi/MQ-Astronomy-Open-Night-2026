# Map · walking directions — explicit Google consent disclosure, DECLINE (B2, §2b)
#
# The map's "Directions" FAB pushes the in-app Google nav screen
# (`Routes.googleNavTo(...)`); the old offline picker is gone (MAP-007). On a
# first-run (`unknown`) consent the screen shows the EXPLICIT first-use
# disclosure dialog BEFORE any Google surface can initialise (B2, 2026-09-01).
# This flow is the on-device proof of the §2b consent boundary: tap Directions →
# disclosure → Decline → the nav screen rebuilds into the sharing-off panel (a
# one-tap re-enable + Back), and NO Google map is ever drawn — never a bounce out
# to the external Google Maps app either.
#
# Decline does NOT auto-return to the map: it leaves the visitor on the nav
# screen showing the sharing-off state (honest — it re-discloses and offers the
# way back), which is why we assert the panel here and then tap Back ourselves.
# (README trap 6: a dialog button's LABEL may not be its hit target — tap by
# point if `tapOn` on the label does nothing.)
appId: au.edu.mq.astronomy.aon2026
tags: [map]
---
# Reset consent to `unknown` so the FIRST-USE disclosure is actually exercised —
# a prior run's Decline persists as `declined` and would skip to the panel.
- launchApp:
    clearState: true
- runFlow: flows/open-map.yaml

- tapOn: "Directions"

# (§2b) The explicit disclosure appears BEFORE any Google surface is built. Its
# TITLE is the distinguisher from the sharing-off panel (they share a body).
- assertVisible: "Use Google Maps for directions?"
- assertVisible: "(?s).*sent to Google Maps.*"
- takeScreenshot: .maestro/screenshots/wayfinding-01-disclosure

# Decline — consent set to `declined`. The dialog is dismissed and the nav screen
# rebuilds into the sharing-off panel: destination title in the AppBar + a single
# re-enable button. No Google map — "Zoom in" (a campus-map control) is absent.
- tapOn: "Not now"
- assertNotVisible: "Use Google Maps for directions?"
- assertNotVisible: "Not now"
- assertVisible: "Central Courtyard"
- assertVisible: "Use Google Maps"
- assertNotVisible: "Zoom in"
- takeScreenshot: .maestro/screenshots/wayfinding-02-declined-sharing-off

# The way back works — Back returns to the campus map.
- tapOn: "Back"
- assertVisible: "Zoom in"
