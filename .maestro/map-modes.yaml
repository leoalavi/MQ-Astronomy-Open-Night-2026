# Map · the two map modes
#
# Tests: the Map / 360° toggle switches the body, and the walk-route FAB + zoom
# controls are campus-map ONLY (they must not overlay the 360° picker).
# The compass/AR mode was retired — the toggle now has just Map and 360°.
appId: au.edu.mq.astronomy.aon2026
tags: [map]
---
- runFlow: flows/open-map.yaml
- assertVisible: "Directions"
- assertVisible: "Zoom in"

# ── 360° panorama picker ────────────────────────────────────────────────────
- tapOn: "360°"
- takeScreenshot: .maestro/screenshots/modes-01-panorama-picker
# the campus-map chrome must NOT overlay the 360° picker
- assertNotVisible: "Directions"
- assertNotVisible: "Zoom in"
# the picker itself is showing (the Solar walk is pinned at its top)
- assertVisible: "(?s).*Solar system walk.*"

# ── back to the campus map ──────────────────────────────────────────────────
# "Map" is ambiguous — the AppBar title is ALSO exactly "Map" and comes first in
# the hierarchy, so a bare `tapOn: "Map"` hits the title and nothing happens.
# index 1 is the toggle segment; its bounds are stable across both modes.
- tapOn:
    text: "Map"
    index: 1
- assertVisible: "Zoom in"
- assertVisible: "Directions"
- assertVisible: "Campus map: Macquarie University"
