name: aon2026
description: >-
  Astronomy Open Night 2026 — event discovery and night-time campus wayfinding
  companion for Astronomy Open Night (19 September 2026). An independent
  project; not affiliated with, endorsed or sponsored by any university.
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.11.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Web-only, from the SDK: lib/app/url_strategy_web.dart calls
  # usePathUrlStrategy() so web routes are clean paths, not hash fragments.
  # Pulled in only by the web conditional import; native never links it.
  flutter_web_plugins:
    sdk: flutter

  # State management — mirrors the MQ Journey stack so the team keeps one
  # mental model across both products.
  flutter_riverpod: ^3.3.2

  # Declarative routing (deep-linkable screens, typed route names).
  go_router: ^17.3.0

  # Illustrated campus basemap + on-map markers/projection: flutter_map renders
  # the bundled `aon_event_map.png` overlay (CrsSimple) and the location/route
  # layers from a local asset — no network tile source of any kind. Google Maps
  # (below) powers turn-by-turn walking navigation only.
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

  # Date/time formatting for the programme and "What's On Now" logic.
  intl: ^0.20.2

  cupertino_icons: ^1.0.8
  flutter_inappwebview: ^6.1.5
  shared_preferences: ^2.5.5
  confetti: ^0.8.0
  mobile_scanner: ^7.4.0
  geolocator: ^14.0.3
  sensors_plus: ^7.1.0
  google_maps_flutter: ^2.18.0
  # Promoted from TRANSITIVE (google_maps_flutter_web already depends on it) to
  # direct, because lib/services/maps_js_loader_web.dart injects the Google Maps
  # JavaScript API itself. The plugin ships no loader and its README says to put
  # the key in web/index.html, which is committed — so the key would become a
  # tracked secret. Loading it at runtime keeps the key in config. No new package
  # enters the resolution; this only records a dependency we already had.
  web: ^1.0.0
  http: ^1.6.0
  url_launcher: ^6.3.2
  # Web-only need: the 360° tour is an <iframe> (a web platform view), which
  # swallows pointer events for the Flutter controls floated over it (scene
  # rail, title, back button). PointerInterceptor lets those taps through. On
  # iOS/Android/desktop its implementation is a passthrough, so native is
  # unaffected. Maintained under flutter/packages.
  pointer_interceptor: ^0.10.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  crypto: ^3.0.0 # test-only: verify the vendored buildings.json SHA-256 in-suite
  # test-only: mock the url_launcher platform in url_opener_test (drives the real
  # provider closure without launching a browser). Already resolved transitively.
  url_launcher_platform_interface: ^2.3.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  generate: true

  shaders:
    - shaders/glass_refraction.frag
  assets:
    - assets/images/
    - assets/web/indoor_viewer.html
    - assets/web/pannellum/
    - assets/data/indoor/
    - assets/data/buildings.json
    - assets/maps/
    # Ship the font licence alongside the app (SIL OFL 1.1 requires it).
    - assets/fonts/vazirmatn/OFL.txt

  # Vazirmatn (SIL OFL 1.1) is bundled ONLY as a Persian/Arabic fallback face —
  # it is never the primary family, so Latin/English keeps the platform system
  # font unchanged. It exists so Persian renders from a bundled font instead of
  # CanvasKit fetching Noto from fonts.gstatic.com at runtime (offline-capable,
  # no third-party font request). See lib/app/theme/aon_typography.dart.
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/vazirmatn/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/vazirmatn/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/vazirmatn/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/vazirmatn/Vazirmatn-Bold.ttf
          weight: 700
