# Settings · persistence across a restart
#
# Two release-critical restart behaviours the base settings.yaml does not cover:
#   1. a chosen LANGUAGE survives a restart — and Persian RTL mirrors the tab bar,
#      so Settings moves from the RIGHT (~88%) to the LEFT (~12%).
#   2. "Delete my data" stays DELETED after a restart (a NO-GO condition — erased
#      data must never return).
#
# Tab taps after a CLEAN launch are by POINT, y=91% (tab-bar row centre). Slots
# (LTR): Home 8%, Program 27%, Night 42%, Map 58%, Info 73%, Settings 88%; Persian
# mirrors them. Tab taps after a bare RESTART are by label — see the note below.
appId: au.edu.mq.astronomy.aon2026
tags: [settings]
---
# ── 1. A chosen language survives a restart ──
- launchApp:
    clearState: true
# Let the first frame land before a by-point tap (cold-boot guard, see
# flows/open-map.yaml); a tap during boot hits nothing and the flow derails.
- extendedWaitUntil:
    visible: "Astronomy Open Night"
    timeout: 10000
# Verified 2026-09-05: without this swipe the by-point tab tap right after a
# launch lands on nothing (the same XCTest cold-boot guard flows/open-map.yaml uses).
- swipe:
    direction: DOWN
    duration: 100
- tapOn:
    point: "88%,91%"          # Settings (LTR: slot 6, right)
- assertVisible: "Appearance"
- tapOn: "Persian"            # the Persian option, labelled "Persian" in English
- assertVisible: "تنظیمات"     # the whole app flips to Persian
- launchApp                    # restart — the choice must survive
- extendedWaitUntil:
    visible: "Astronomy Open Night"   # hero title is EventInfo.name (English data even under Persian UI)
    timeout: 10000
- swipe:
    direction: DOWN
    duration: 100
# By LABEL, not point: after a bare restart Maestro can still hold the
# pre-restart tree, and a by-point tap fires before the new process is
# interactive (verified 2026-09-05). The unselected tab's semantics label is
# the plain tab name, unique on Home.
- tapOn: "تنظیمات"            # Settings tab (Persian; mirrored to the LEFT under RTL)
- assertVisible: "زبان"        # on the Persian Settings screen (Language)
- tapOn: "English"            # endonym, never translated — restore English
- assertVisible: "Settings"

# ── 2. "Delete my data" stays erased across a restart ──
# Create real persisted state to delete.
- tapOn:
    point: "27%,91%"          # Program
- assertVisible: "Search talks, activities, presenters"
- tapOn: "Search talks, activities, presenters"
- inputText: "Cosmic"
- tapOn: "(?s).*Save Cosmic arcade to My Night.*"
- launchApp                    # clean, keyboard-free state; the saved plan persists
- extendedWaitUntil:
    visible: "Astronomy Open Night"
    timeout: 10000
- tapOn: "Settings"           # tab, by label (see note above)
- assertVisible: "Appearance"
- scrollUntilVisible:
    element:
      text: "(?s).*Delete my data.*"
    direction: DOWN
    centerElement: true   # else the Delete button lands under the floating tab bar (Android, 2026-09-05)
- tapOn: "Delete"             # opens the confirm dialog
- assertVisible: "Delete data stored on this device?"
- tapOn: "Delete"             # confirm — the dialog is modal, so this is the only "Delete"
- launchApp                    # restart — deleted data must NOT return
- extendedWaitUntil:
    visible: "Astronomy Open Night"
    timeout: 10000
- tapOn: "Night"              # My Night tab, by label (see note above)
- assertVisible: "Your night is empty"
