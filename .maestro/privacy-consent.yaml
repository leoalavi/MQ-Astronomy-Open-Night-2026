# Privacy · Google directions — implicit consent + persistence (B2, §2b)
#
# The first-use disclosure MODAL was retired: Google Maps is the sole walking-
# directions provider, so opening Directions IS the consent — implicit accept,
# no modal (google_nav_screen `_acceptConsentOnce`). This is the §2b positive
# proof: tapping Directions goes STRAIGHT to the in-app Google nav screen (the
# destination title in the AppBar, the campus-map chrome gone), with NO first-use
# modal and without bouncing out to the external Google Maps app. The accepted
# state then PERSISTS across a relaunch — Directions behaves identically.
appId: au.edu.mq.astronomy.aon2026
tags: [map]
---
- launchApp:
    clearState: true
- setLocation:
    latitude: -33.7737
    longitude: 151.1134
- runFlow: flows/open-map.yaml

- tapOn: "Directions"
# Implicit accept — NO first-use modal; we land on the in-app Google nav screen.
- assertNotVisible: "Use Google Maps for directions?"
- assertVisible: "Central Courtyard"
- assertNotVisible: "Zoom in"
- takeScreenshot: .maestro/screenshots/consent-01-accepted
- tapOn: "Back"
- assertVisible: "Zoom in"

# Persistence — relaunch WITHOUT clearing state; Directions still goes straight
# through (accepted persists, still no modal).
- runFlow: flows/open-map.yaml
- tapOn: "Directions"
- assertNotVisible: "Use Google Maps for directions?"
- assertVisible: "Central Courtyard"
- assertNotVisible: "Zoom in"
- takeScreenshot: .maestro/screenshots/consent-02-persisted
